<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FrontWars">
<meta name="theme-color" content="#0e1118">
<title>FrontWars</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
/* VOICE: das Spiel selbst, ohne Rahmen – genau wie das pygame-Fenster
   IDEA: eine Leinwand über den ganzen Bildschirm, alles andere zeichnet das Spiel
   PICTURE: die Weltkarte im Hintergrund des Menüs
   COLOUR and TYPE: die Farben aus FrontWars.py (BG 14,17,24, Gold, Akzent), Systemschrift wie SysFont
   LAYOUT: Vollbild; ein unsichtbares Eingabefeld liegt über dem gerade aktiven Textkasten */
:root{color-scheme:dark}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#0e1118;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#txt{position:fixed;display:none;margin:0;padding:0;border:0;background:transparent;color:#eceff5;caret-color:#f6c448;font-family:"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;outline:none;-webkit-user-select:text;user-select:text;z-index:2}
noscript{position:fixed;inset:0;display:grid;place-items:center;color:#eceff5;font:16px system-ui,sans-serif;padding:24px;text-align:center}
</style>
</head>
<body>
<canvas id="cv" aria-label="FrontWars Spielfeld"></canvas>
<input id="txt" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Texteingabe">
<noscript>FrontWars braucht JavaScript.</noscript>
<script src="pako.min.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="net.js"></script>
<script src="gfx.js"></script>
<script src="blobs.js"></script>
<script src="screens.js"></script>
<script src="game.js"></script>
<script src="main.js"></script>
</body>
</html>
